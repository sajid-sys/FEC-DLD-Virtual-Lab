<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FEC DLD Virtual Lab</title>
<meta name="author" content="Shahriar Hossen Sajid">
<meta name="description" content="FEC DLD Virtual Lab — practise digital logic design experiments on a virtual trainer board and breadboard. Developed and maintained by Shahriar Hossen Sajid.">
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Crimson+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
<header>
  <div class="brand">
    <img src="assets/logo.png" width="38" height="38" alt="Faridpur Engineering College logo">
    <div class="bt"><b>FEC DLD Virtual Lab</b><span>Faridpur Engineering College</span></div>
  </div>
  <div class="tb">
    <button class="ib" id="undoB" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button class="ib" id="redoB" title="Redo (Ctrl+Y)" aria-label="Redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    <span class="sep hide-m"></span>
    <button class="ib hide-m" id="zoB" title="Zoom out" aria-label="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M20 20l-4-4"/></svg></button>
    <button class="ib hide-m" id="ziB" title="Zoom in" aria-label="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M11 8v6M20 20l-4-4"/></svg></button>
    <button class="ib" id="fitB" title="Fit board to screen" aria-label="Fit board to screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <span class="sep"></span>
    <button class="ib" id="helpB" title="How it works" aria-label="How it works"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17.5v.5"/></svg></button>
    <button class="ib" id="themeB" title="Light / dark" aria-label="Toggle dark mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    <button class="btn sm" id="sheetBtn" aria-label="Open lab sheet">Lab sheet</button>
  </div>
</header>
<main>
<aside id="side">
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="exp">Experiments</button>
    <button role="tab" aria-selected="false" data-tab="parts">ICs</button>
    <button role="tab" aria-selected="false" data-tab="guide">Help</button>
  </div>
  <div class="pane" id="pane-exp"></div>
  <div class="pane" id="pane-parts" hidden></div>
  <div class="pane" id="pane-guide" hidden></div>
  <div class="credit"><img src="assets/logo.png" alt=""><span>Developed and maintained by <b>Shahriar Hossen Sajid</b></span></div>
</aside>
<div id="benchWrap">
  <svg id="bench" xmlns="http://www.w3.org/2000/svg" aria-label="FEC DLD Virtual Lab bench: trainer board with breadboard">
    <defs>
      <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="smoke" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
    </defs>
    <g id="vp"><g id="board"></g><g id="icL"></g><g id="wireL"></g><g id="tagL"></g><g id="guideL"></g><g id="hlL"></g><g id="pendL"></g></g>
  </svg>
  <div id="tools">
    <button class="tool" id="tGuide" aria-pressed="false" title="Show the next connection on the board"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>Guide</button>
    <button class="tool" id="tSig" aria-pressed="false" title="Colour wires by logic level"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 17h4V7h5v10h4V7h5v10h2"/></svg>Signals</button>
    <button class="tool" id="tPwr" aria-pressed="true" title="Trainer power"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>Power</button>
  </div>
  <div id="coach" role="status" aria-live="polite"></div>
  <div id="rotHint" role="note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="10" height="15" rx="2"/><path d="M14 3a7 7 0 0 1 7 7"/><path d="M18 9.5l3 .5.5-3"/></svg><span>Turn your phone sideways for a bigger board, or pinch to zoom in.</span><button id="rotX" aria-label="Dismiss tip">×</button></div>
  <div id="tip"></div>
  <div id="warn"></div>
  <div id="selCard"></div>
</div>
</main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal"><div class="dlg" id="dlg" role="dialog" aria-modal="true"></div></div>

<script src="js/core.js"></script>
<script src="js/app.js"></script>
</body>
</html>
